version: "3.7"
services:
  postgres:
    image: postgres:13-alpine
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    logging:
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - "${PWD}/db-data:/var/lib/postgresql/data"

  local-runner:
    image: amazon/mwaa-local:2_10_3
    restart: always
    depends_on:
      - postgres
    environment:
      - LOAD_EX=n
      - EXECUTOR=Local
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
    logging:
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      # Analytical Platform
      - "${HOME}/.kube/config:/usr/local/airflow/dags/.kube/config"
      - "${PWD}/../dist/dags:/usr/local/airflow/dags"
      - "${PWD}/../airflow/.airflowignore:/usr/local/airflow/dags/.airflowignore"
      - "${PWD}/../airflow/dag_factory.py:/usr/local/airflow/dags/dag_factory.py"
      - "${PWD}/../airflow/analytical_platform:/usr/local/airflow/dags/analytical_platform"
      # MWAA Local Runner
      - "${PWD}/requirements:/usr/local/airflow/requirements"
      - "${PWD}/startup_script:/usr/local/airflow/startup"
    ports:
      - "8080:8080"
    command: local-runner
    healthcheck:
      test: ["CMD-SHELL", "[ -f /usr/local/airflow/airflow-webserver.pid ]"]
      interval: 30s
      timeout: 30s
      retries: 3
    env_file:
      - ./config/.env.localrunner
